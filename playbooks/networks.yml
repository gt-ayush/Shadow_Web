---
- name: Configure Dedicated Podman Networks
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Ensure dns-net exists with /16 subnet for registrar and DNS mapping
      containers.podman.podman_network:
        name: "dns-net"
        state: present
        subnet: "10.89.0.0/16"
        gateway: "10.89.0.1"

    - name: Ensure remaining dedicated Podman networks exist
      containers.podman.podman_network:
        name: "{{ item }}"
        state: present
      loop:
        - internet-net
        - registry-net
        - hosting-net
        - mail-net
        - monitor-net
        - storage-net
