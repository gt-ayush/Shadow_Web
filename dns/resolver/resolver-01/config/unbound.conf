server:
    verbosity: 1
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-udp: yes
    do-tcp: yes

    # Allow queries from your dedicated dns-net subnet
    access-control: 10.89.0.0/16 allow

    # Use your private root hints to begin iterative traversal
    root-hints: "/etc/unbound/root.hints"

    # Security and hardening flags
    hide-identity: yes
    hide-version: yes
    val-clean-additional: yes
