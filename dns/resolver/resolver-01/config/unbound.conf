server:
    verbosity: 1
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    # Access control: allow internal container subnets
    access-control: 127.0.0.0/8 allow
    access-control: 10.89.0.0/16 allow
    access-control: 10.0.0.0/8 allow

    # Security settings adjusted for private DNS hierarchy
    harden-glue: yes
    harden-dnssec-stripped: no
    use-caps-for-id: no
    edns-buffer-size: 1232

    # Point directly to private root hints
    root-hints: "/etc/unbound/root.hints"

    # Private domains protection off for custom TLDs
    domain-insecure: "x."
    domain-insecure: "web."
    domain-insecure: "shop."
    domain-insecure: "mail."
    domain-insecure: "cloud."
    domain-insecure: "dev."
